<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vamus — Markkinoinnin konsultointi &amp; valmennus</title>
<meta name="description" content="Vamus tarjoaa markkinoinnin konsultointia ja valmennusta. Uusi sivusto tulossa pian.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14284d;
    --blue:#2f5fa0;
    --sky:#4fa8d8;
    --paper:#fbfbfa;
    --muted:#5a6b85;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }

  body{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Background wave motif, echoing the dip in the VAMUS mark */
  .wave-bg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    padding:6vh 32px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .logo{
    width:min(260px, 60vw);
    height:auto;
    opacity:0;
    animation:rise 0.9s cubic-bezier(.16,1,.3,1) forwards;
  }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(1.9rem, 4.4vw, 2.9rem);
    line-height:1.18;
    letter-spacing:-0.01em;
    margin:44px 0 18px;
    color:var(--ink);
    opacity:0;
    animation:rise 0.9s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:0.12s;
  }

  p.sub{
    font-size:1.05rem;
    line-height:1.6;
    color:var(--muted);
    margin:0;
    max-width:34em;
    opacity:0;
    animation:rise 0.9s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay:0.22s;
  }

  footer{
    position:absolute;
    bottom:28px;
    left:0;
    right:0;
    text-align:center;
    font-size:0.82rem;
    color:var(--muted);
    opacity:0.7;
    z-index:1;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  @media (prefers-reduced-motion: reduce){
    .logo, h1, p.sub{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }

  @media (max-width: 480px){
    .content{padding:8vh 24px;}
  }
</style>
</head>
